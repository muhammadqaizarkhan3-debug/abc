<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Muhammad Qaizar Khan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="identity">
      <h1>Muhammad Qaizar Khan</h1>
      <p class="subtitle">Computer Science Student, O Level Candidate</p>
    </div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="leadership.html">Leadership</a>
      <a href="experience.html">Experience</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<div class="page-lead">
  <h2>Get in Touch</h2>
  <p>Have a question or want to work together? Send me a message and I will get back to you.</p>
</div>

<main>

<section class="content-section reveal">
  <h3>Send a Message</h3>
  <form class="contact-form" id="contactForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your full name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="What would you like to say?" required></textarea>

    <button type="submit">Send Message</button>
  </form>
  <p class="form-note" id="formNote"></p>
</section>

</main>

<footer>
  <p>Thanks for stopping by. Feel free to reach out and connect.</p>
</footer>

<button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

<script src="script.js"></script>
</body>
</html>
