<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .calculator {
    background: #111827;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    width: 320px;
  }
  .display {
    background: #000;
    color: #fff;
    border-radius: 12px;
    padding: 20px 15px;
    text-align: right;
    margin-bottom: 15px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .display .prev {
    font-size: 16px;
    color: #9ca3af;
    min-height: 20px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .display .current {
    font-size: 36px;
    font-weight: bold;
    overflow-x: auto;
    white-space: nowrap;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 12px;
    font-size: 20px;
    padding: 18px 0;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
    color: #fff;
    background: #374151;
  }
  button:hover {
    filter: brightness(1.15);
  }
  button:active {
    transform: scale(0.95);
  }
  button.operator {
    background: #f59e0b;
  }
  button.equals {
    background: #10b981;
    grid-column: span 2;
  }
  button.clear, button.delete {
    background: #ef4444;
  }
  button.zero {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="prev" id="prevOperand"></div>
    <div class="current" id="currentOperand">0</div>
  </div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">AC</button>
    <button class="delete" onclick="deleteLast()">DEL</button>
    <button class="operator" onclick="chooseOperator('%')">%</button>
    <button class="operator" onclick="chooseOperator('÷')">÷</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="chooseOperator('×')">×</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="operator" onclick="chooseOperator('-')">-</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="operator" onclick="chooseOperator('+')">+</button>

    <button class="zero" onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let currentOperand = '0';
  let prevOperand = '';
  let operation = undefined;

  const currentOperandEl = document.getElementById('currentOperand');
  const prevOperandEl = document.getElementById('prevOperand');

  function updateDisplay() {
    currentOperandEl.textContent = currentOperand;
    if (operation != null) {
      prevOperandEl.textContent = `${prevOperand} ${operation}`;
    } else {
      prevOperandEl.textContent = '';
    }
  }

  function appendNumber(number) {
    if (number === '.' && currentOperand.includes('.')) return;
    if (currentOperand === '0' && number !== '.') {
      currentOperand = number;
    } else {
      currentOperand += number;
    }
    updateDisplay();
  }

  function chooseOperator(op) {
    if (currentOperand === '') return;
    if (prevOperand !== '') {
      calculate();
    }
    operation = op;
    prevOperand = currentOperand;
    currentOperand = '';
    updateDisplay();
  }

  function calculate() {
    let result;
    const prev = parseFloat(prevOperand);
    const current = parseFloat(currentOperand);
    if (isNaN(prev) || isNaN(current)) return;

    switch (operation) {
      case '+':
        result = prev + current;
        break;
      case '-':
        result = prev - current;
        break;
      case '×':
        result = prev * current;
        break;
      case '÷':
        result = current === 0 ? 'Error' : prev / current;
        break;
      case '%':
        result = prev % current;
        break;
      default:
        return;
    }

    currentOperand = result.toString();
    operation = undefined;
    prevOperand = '';
    updateDisplay();
  }

  function clearAll() {
    currentOperand = '0';
    prevOperand = '';
    operation = undefined;
    updateDisplay();
  }

  function deleteLast() {
    if (currentOperand.length === 1) {
      currentOperand = '0';
    } else {
      currentOperand = currentOperand.slice(0, -1);
    }
    updateDisplay();
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
    if (e.key === '.') appendNumber('.');
    if (e.key === '+') chooseOperator('+');
    if (e.key === '-') chooseOperator('-');
    if (e.key === '*') chooseOperator('×');
    if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
    if (e.key === 'Enter' || e.key === '=') calculate();
    if (e.key === 'Backspace') deleteLast();
    if (e.key === 'Escape') clearAll();
  });
</script>

</body>
</html>
